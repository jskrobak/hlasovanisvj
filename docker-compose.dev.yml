# Vývojová databáze PostgreSQL.
# Spuštění: PG_PASSWORD=... docker compose -f docker-compose.dev.yml up -d
name: hlasovanisvj-db

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: hlasovanisvj
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Nastav PG_PASSWORD}
      POSTGRES_DB: hlasovanisvj
      TZ: Europe/Prague
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
